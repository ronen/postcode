<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>The application owns the job; policies govern execution</title><desc>Follow one supplied operation, then distinguish reusable policy state from one call&#x27;s progress.</desc><defs><marker id="ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#19333E"/></marker><marker id="teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#007A78"/></marker><marker id="red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#B44635"/></marker><marker id="purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7047A3"/></marker><marker id="muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#526873"/></marker></defs><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FCFBF7" stroke="none" stroke-width="2"/><text x="60" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#007A78" text-anchor="start">COCKATIEL  /  A PICTORIAL WORKING ACCOUNT</text><text x="1540" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#526873" text-anchor="end">01 / 04</text><text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#19333E" text-anchor="start">The application owns the job; policies govern execution</text><text x="60" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526873" text-anchor="start">Follow one supplied operation, then distinguish reusable policy state from one call&#x27;s progress.</text><path d="M60,1026 L1540,1026" fill="none" stroke="#C9D4D5" stroke-width="1" stroke-linecap="round"/><text x="60" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="start">Source: 14 Oct 2026 working account, first extraction. Static inspection; no runtime verification.</text><text x="1540" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#526873" text-anchor="end">VIEW 1</text><rect x="60" y="197" width="425" height="670" rx="14" fill="#F0F2EE" stroke="none" stroke-width="2"/><text x="90" y="241" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#19333E" text-anchor="start">APPLICATION</text><text x="90" y="277" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#19333E" text-anchor="start">Owns the business lifecycle</text><path d="M105 335 V318 H181 L202 335 H292 V454 H105 Z" fill="#FCFBF7" stroke="#356989" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(130 344) scale(0.85)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#356989" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#356989" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#356989" text-anchor="middle">job</text><path d="M16,60 L54,60" fill="none" stroke="#356989" stroke-width="2" stroke-linecap="round"/></g><text x="320" y="360" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#19333E" text-anchor="start">Identity</text><text x="320" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526873" text-anchor="start">Prepare</text><text x="320" y="422" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526873" text-anchor="start">Acknowledge</text><text x="320" y="450" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526873" text-anchor="start">Store outcome</text><text x="90" y="527" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#19333E" text-anchor="start">Creates and retains policies.</text><text x="90" y="561" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#19333E" text-anchor="start">Chooses which operations</text><text x="90" y="595" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#19333E" text-anchor="start">share each instance.</text><text x="90" y="671" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#356989" text-anchor="start">No automatic grouping</text><text x="90" y="701" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#356989" text-anchor="start">by the service contacted.</text><text x="90" y="807" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#19333E" text-anchor="start">Value or error returns here</text><rect x="535" y="197" width="1005" height="670" rx="14" fill="#E6F3F0" stroke="#007A78" stroke-width="2"/><text x="565" y="241" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#007A78" text-anchor="start">POLICY-CONTROLLED EXECUTION</text><text x="565" y="279" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">Application supplies the work; Cockatiel need not know its business meaning.</text><g transform="translate(580 345) scale(1)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">op</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><text x="615" y="457" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526873" text-anchor="middle">operation</text><path d="M655,386 L782,386" fill="none" stroke="#007A78" stroke-width="3" stroke-linecap="round" marker-end="url(#teal)"/><text x="720" y="365" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#007A78" text-anchor="middle">execute</text><rect x="800" y="318" width="397" height="200" rx="20" fill="#FCFBF7" stroke="#007A78" stroke-width="3"/><text x="998" y="354" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#19333E" text-anchor="middle">Reusable policy object(s)</text><g transform="translate(837 375) scale(0.8)"><path d="M0,55 L38,55" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="55" r="6" fill="#FCFBF7" stroke="#007A78" stroke-width="3"/><circle cx="112" cy="55" r="6" fill="#FCFBF7" stroke="#007A78" stroke-width="3"/><path d="M44,55 L106,55" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round"/></g><path d="M1000 381 V461 H1075 V381" fill="none" stroke="#007A78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(1011.474358974359 393) scale(0.7435897435897436)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">op</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><text x="1123" y="427" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#007A78" text-anchor="middle">...</text><path d="M1197,386 L1301,386" fill="none" stroke="#007A78" stroke-width="3" stroke-linecap="round" marker-end="url(#teal)"/><text x="1249" y="365" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#007A78" text-anchor="middle">calls</text><circle cx="1390" cy="386" r="59" fill="#FCFBF7" stroke="#007A78" stroke-width="3"/><path d="M1377 359 L1415 386 L1377 413 Z" fill="#007A78" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1390" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#19333E" text-anchor="middle">Supplied work</text><path d="M1197 487 H1490 V826 H484" fill="none" stroke="#19333E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/><text x="1450" y="805" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="end">eventual value / error</text><path d="M998,520 L998,561" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/><rect x="565" y="565" width="540" height="195" rx="14" fill="#FCFBF7" stroke="#007A78" stroke-width="2"/><text x="590" y="601" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#007A78" text-anchor="start">State shared across calls</text><g transform="translate(595 626) scale(0.7)"><path d="M0,55 L38,55" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="55" r="6" fill="#FCFBF7" stroke="#B44635" stroke-width="3"/><circle cx="112" cy="55" r="6" fill="#FCFBF7" stroke="#B44635" stroke-width="3"/><path d="M43,51 L96,12" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/></g><text x="735" y="636" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">Breaker: failure / recovery state</text><text x="735" y="665" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">Bulkhead: running count +</text><text x="735" y="694" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">in-memory waiting queue</text><text x="1140" y="588" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#19333E" text-anchor="start">One execution</text><circle cx="1150" cy="641" r="24" fill="#FCFBF7" stroke="#007A78" stroke-width="2"/><text x="1150" y="649" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">1</text><path d="M1178,641 L1216,641" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" marker-end="url(#teal)"/><circle cx="1250" cy="641" r="24" fill="#FCFBF7" stroke="#007A78" stroke-width="2"/><text x="1250" y="649" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">2</text><path d="M1278,641 L1316,641" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" marker-end="url(#teal)"/><circle cx="1350" cy="641" r="24" fill="#FCFBF7" stroke="#007A78" stroke-width="2"/><text x="1350" y="649" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">3</text><text x="1140" y="704" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">Retry-attempt progress</text><text x="1140" y="732" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">belongs to this execution.</text><text x="60" y="922" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#19333E" text-anchor="start">Read this as a division of responsibilities, not a deployment diagram.</text><text x="60" y="956" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#19333E" text-anchor="start">The operation ticket is an invocation, not a durable submitted job. Symbols recur in the next views.</text></svg>