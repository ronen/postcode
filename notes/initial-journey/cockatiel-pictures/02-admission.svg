<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>Starting, waiting and succeeding are different</title><desc>Illustrative states, not execution traces. Repeated tickets along arrows show the same call at successive positions.</desc><defs><marker id="ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#19333E"/></marker><marker id="teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#007A78"/></marker><marker id="red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#B44635"/></marker><marker id="purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7047A3"/></marker><marker id="muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#526873"/></marker></defs><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FCFBF7" stroke="none" stroke-width="2"/><text x="60" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#007A78" text-anchor="start">COCKATIEL  /  A PICTORIAL WORKING ACCOUNT</text><text x="1540" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#526873" text-anchor="end">02 / 04</text><text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#19333E" text-anchor="start">Starting, waiting and succeeding are different</text><text x="60" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526873" text-anchor="start">Illustrative states, not execution traces. Repeated tickets along arrows show the same call at successive positions.</text><path d="M60,1026 L1540,1026" fill="none" stroke="#C9D4D5" stroke-width="1" stroke-linecap="round"/><text x="60" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="start">Source: 14 Oct 2026 working account, first extraction. Static inspection; no runtime verification.</text><text x="1540" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#526873" text-anchor="end">VIEW 2</text><text x="60" y="218" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="start">BULKHEAD  /  CAPACITY</text><text x="60" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526873" text-anchor="start">Example only: 1 execution slot + 1 queue slot</text><text x="880" y="218" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="start">BREAKER  /  PERMISSION</text><text x="880" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526873" text-anchor="start">Default single-trial example for half-open</text><path d="M819,203 L819,809" fill="none" stroke="#C9D4D5" stroke-width="2" stroke-linecap="round"/><g transform="translate(77 300) scale(0.7)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">new</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><path d="M137,331 L183,331" fill="none" stroke="#007A78" stroke-width="3" stroke-linecap="round" marker-end="url(#teal)"/><path d="M213 292 V390 H306 V292" fill="none" stroke="#007A78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(231.5 304) scale(0.8)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">new</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><path d="M343 292 V390 H436 V292" fill="none" stroke="#95600B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="416" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="middle">execution</text><text x="390" y="416" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="middle">queue</text><text x="476" y="321" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#007A78" text-anchor="start">START</text><text x="476" y="356" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">Capacity available.</text><text x="476" y="385" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">Outcome still pending.</text><g transform="translate(77 466) scale(0.7)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">new</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><path d="M137,497 L183,497" fill="none" stroke="#007A78" stroke-width="3" stroke-linecap="round" marker-end="url(#teal)"/><path d="M213 458 V556 H306 V458" fill="none" stroke="#007A78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(231.5 470) scale(0.8)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">run</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><path d="M343 458 V556 H436 V458" fill="none" stroke="#95600B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(361 475) scale(0.7)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#95600B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#95600B" text-anchor="middle">new</text><path d="M16,60 L54,60" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round"/></g><text x="260" y="582" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="middle">execution</text><text x="390" y="582" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="middle">queue</text><text x="476" y="487" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#95600B" text-anchor="start">WAIT</text><text x="476" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">Execution full; queue has room.</text><text x="476" y="551" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">Result remains pending.</text><g transform="translate(77 632) scale(0.7)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">new</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><path d="M137,663 L183,663" fill="none" stroke="#007A78" stroke-width="3" stroke-linecap="round" marker-end="url(#teal)"/><path d="M213 624 V722 H306 V624" fill="none" stroke="#007A78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(231.5 636) scale(0.8)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">run</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><path d="M343 624 V722 H436 V624" fill="none" stroke="#95600B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(361.5 636) scale(0.8)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#95600B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#95600B" text-anchor="middle">wait</text><path d="M16,60 L54,60" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round"/></g><text x="260" y="748" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="middle">execution</text><text x="390" y="748" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="middle">queue</text><path d="M159,650 L185,676" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/><path d="M159,676 L185,650" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/><text x="476" y="653" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#B44635" text-anchor="start">REFUSE</text><text x="476" y="688" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">Both capacities exhausted.</text><text x="476" y="717" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">Admission error.</text><g transform="translate(880 283) scale(1)"><path d="M0,55 L38,55" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="55" r="6" fill="#FCFBF7" stroke="#007A78" stroke-width="3"/><circle cx="112" cy="55" r="6" fill="#FCFBF7" stroke="#007A78" stroke-width="3"/><path d="M44,55 L106,55" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round"/></g><text x="1070" y="313" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#007A78" text-anchor="start">CLOSED</text><text x="1070" y="351" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">Normally allows work</text><g transform="translate(880 405) scale(1)"><path d="M0,55 L38,55" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="55" r="6" fill="#FCFBF7" stroke="#B44635" stroke-width="3"/><circle cx="112" cy="55" r="6" fill="#FCFBF7" stroke="#B44635" stroke-width="3"/><path d="M43,51 L96,12" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/></g><text x="1070" y="435" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#B44635" text-anchor="start">OPEN</text><text x="1070" y="473" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">Withholds attempts</text><g transform="translate(880 530) scale(1)"><path d="M0,55 L38,55" fill="none" stroke="#95600B" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#95600B" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="55" r="6" fill="#FCFBF7" stroke="#95600B" stroke-width="3"/><circle cx="112" cy="55" r="6" fill="#FCFBF7" stroke="#95600B" stroke-width="3"/><path d="M43,51 L96,12" fill="none" stroke="#95600B" stroke-width="5" stroke-linecap="round"/><path d="M52,65 L99,65" fill="none" stroke="#95600B" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)"/></g><text x="1070" y="560" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#95600B" text-anchor="start">HALF-OPEN</text><text x="1070" y="598" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">Allows limited recovery work</text><g transform="translate(899 649) scale(0.72)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#95600B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#95600B" text-anchor="middle">trial</text><path d="M16,60 L54,60" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(1010 655) scale(0.6)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#526873" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#526873" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#526873" text-anchor="middle">wait</text><path d="M16,60 L54,60" fill="none" stroke="#526873" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(1030 670) scale(0.6)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#526873" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#526873" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#526873" text-anchor="middle">wait</text><path d="M16,60 L54,60" fill="none" stroke="#526873" stroke-width="2" stroke-linecap="round"/></g><text x="1110" y="661" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">While one trial runs, others wait.</text><text x="1110" y="689" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">Then they face the new decision;</text><text x="1110" y="717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">they can still be refused.</text><text x="880" y="780" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526873" text-anchor="start">Manual isolation can also hold the breaker open.</text><rect x="60" y="841" width="1480" height="151" rx="14" fill="#EEF1F3" stroke="none" stroke-width="2"/><path d="M74 895 Q109 859 144 895 Q109 931 74 895" fill="none" stroke="#356989" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="109" cy="895" r="10" fill="#356989" stroke="#356989" stroke-width="1"/><path d="M173 864 V926 H233 V864" fill="none" stroke="#356989" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M260,898 L350,898" fill="none" stroke="#526873" stroke-width="2" stroke-linecap="round" marker-end="url(#muted)"/><circle cx="393" cy="898" r="26" fill="#FCFBF7" stroke="#526873" stroke-width="3"/><path d="M393 882.4 V898 L404.7 903.98" fill="none" stroke="#526873" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M433,898 L523,898" fill="none" stroke="#526873" stroke-width="2" stroke-linecap="round" marker-end="url(#muted)"/><path d="M550 864 V926 H615 V864" fill="none" stroke="#356989" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(564.5512820512821 876) scale(0.5128205128205128)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#356989" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#356989" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#356989" text-anchor="middle">op</text><path d="M16,60 L54,60" fill="none" stroke="#356989" stroke-width="2" stroke-linecap="round"/></g><text x="108" y="968" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526873" text-anchor="middle">look</text><text x="393" y="968" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526873" text-anchor="middle">time passes</text><text x="584" y="968" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526873" text-anchor="middle">another call</text><text x="680" y="884" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#19333E" text-anchor="start">A snapshot reserves nothing.</text><text x="680" y="920" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">Capacity or state can change before execution.</text><text x="680" y="952" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">Waiting is not failure; trial eligibility is not proof of health.</text></svg>