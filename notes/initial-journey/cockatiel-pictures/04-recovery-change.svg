<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>Move the transition, not the work</title><desc>Reported need: avoid expensive job preparation while the breaker blocks work. Scenario not reproduced.</desc><defs><marker id="ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#19333E"/></marker><marker id="teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#007A78"/></marker><marker id="red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#B44635"/></marker><marker id="purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7047A3"/></marker><marker id="muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#526873"/></marker></defs><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FCFBF7" stroke="none" stroke-width="2"/><text x="60" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#007A78" text-anchor="start">COCKATIEL  /  A PICTORIAL WORKING ACCOUNT</text><text x="1540" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#526873" text-anchor="end">04 / 04</text><text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#19333E" text-anchor="start">Move the transition, not the work</text><text x="60" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526873" text-anchor="start">Reported need: avoid expensive job preparation while the breaker blocks work. Scenario not reproduced.</text><path d="M60,1026 L1540,1026" fill="none" stroke="#C9D4D5" stroke-width="1" stroke-linecap="round"/><text x="60" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="start">Source: 14 Oct 2026 working account, first extraction. Static inspection; no runtime verification.</text><text x="1540" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#526873" text-anchor="end">VIEW 4</text><rect x="60" y="190" width="243" height="32" rx="16" fill="#FBECE6" stroke="none" stroke-width="2"/><text x="181.5" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#B44635" text-anchor="middle">REPORTED APPLICATION LOOP</text><path d="M65 267 Q100 231 135 267 Q100 303 65 267" fill="none" stroke="#B44635" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="267" r="10" fill="#B44635" stroke="#B44635" stroke-width="1"/><path d="M143,267 L199,267" fill="none" stroke="#B44635" stroke-width="3" stroke-linecap="round" marker-end="url(#red)"/><text x="222" y="275" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#B44635" text-anchor="start">reads OPEN</text><path d="M367,267 L425,267" fill="none" stroke="#B44635" stroke-width="3" stroke-linecap="round" marker-end="url(#red)"/><text x="450" y="256" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">skips preparation</text><text x="450" y="284" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">and execution</text><path d="M640,267 L706,267" fill="none" stroke="#B44635" stroke-width="3" stroke-linecap="round" marker-end="url(#red)"/><text x="731" y="275" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#B44635" text-anchor="start">no call to trigger recovery</text><path d="M1040 267 H1095 V310 H100 V291" fill="none" stroke="#B44635" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/><text x="1160" y="238" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">This can keep stored</text><text x="1160" y="268" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">state OPEN even after</text><text x="1160" y="298" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">the delay has elapsed.</text><text x="370" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#526873" text-anchor="middle">Breaker opens</text><path d="M370,380 L370,794" fill="none" stroke="#C9D4D5" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 7"/><text x="795" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#526873" text-anchor="middle">Recovery delay elapses</text><path d="M795,380 L795,794" fill="none" stroke="#C9D4D5" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 7"/><text x="1300" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#526873" text-anchor="middle">Later execution, if any</text><path d="M1300,380 L1300,794" fill="none" stroke="#C9D4D5" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 7"/><text x="60" y="425" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="start">CURRENT</text><text x="60" y="461" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526873" text-anchor="start">in the account</text><text x="60" y="488" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526873" text-anchor="start">(also the proposed</text><text x="60" y="515" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526873" text-anchor="start">default behavior)</text><path d="M280,465 L1490,465" fill="none" stroke="#007A78" stroke-width="3" stroke-linecap="round" marker-end="url(#teal)"/><rect x="315" y="418" width="110" height="32" rx="16" fill="#FBECE6" stroke="none" stroke-width="2"/><text x="370.0" y="440" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#B44635" text-anchor="middle">OPEN</text><g transform="translate(327 471) scale(0.6)"><path d="M0,55 L38,55" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="55" r="6" fill="#FCFBF7" stroke="#B44635" stroke-width="3"/><circle cx="112" cy="55" r="6" fill="#FCFBF7" stroke="#B44635" stroke-width="3"/><path d="M43,51 L96,12" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/></g><rect x="740" y="418" width="110" height="32" rx="16" fill="#FBECE6" stroke="none" stroke-width="2"/><text x="795.0" y="440" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#B44635" text-anchor="middle">OPEN</text><circle cx="795" cy="507" r="25" fill="#FCFBF7" stroke="#526873" stroke-width="3"/><path d="M795 492.0 V507 L806.25 512.75" fill="none" stroke="#526873" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="795" y="562" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="middle">No transition.</text><text x="795" y="589" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="middle">No transition event.</text><rect x="1220" y="418" width="163" height="32" rx="16" fill="#FFF2D4" stroke="none" stroke-width="2"/><text x="1301.5" y="440" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#95600B" text-anchor="middle">HALF-OPEN</text><g transform="translate(1267 480) scale(0.72)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#95600B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#95600B" text-anchor="middle">trial</text><path d="M16,60 L54,60" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round"/></g><text x="1300" y="562" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#19333E" text-anchor="middle">Execution checks elapsed time,</text><text x="1300" y="589" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#19333E" text-anchor="middle">transitions and supplies trial.</text><rect x="60" y="611" width="1480" height="203" rx="16" fill="#F0EAF8" stroke="#7047A3" stroke-width="2" stroke-dasharray="10 6"/><text x="84" y="652" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#7047A3" text-anchor="start">PROPOSED</text><text x="84" y="687" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#7047A3" text-anchor="start">opt-in only</text><text x="84" y="714" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#7047A3" text-anchor="start">chosen in simulation</text><path d="M280,678 L1490,678" fill="none" stroke="#7047A3" stroke-width="3" stroke-linecap="round" marker-end="url(#purple)"/><rect x="315" y="630" width="110" height="32" rx="16" fill="#FBECE6" stroke="none" stroke-width="2"/><text x="370.0" y="652" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#B44635" text-anchor="middle">OPEN</text><g transform="translate(327 698) scale(0.6)"><path d="M0,55 L38,55" fill="none" stroke="#B44635" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#B44635" stroke-width