h d="M16,60 L54,60" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round"/></g><text x="1370" y="736" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#19333E" text-anchor="start">Outcome</text><text x="1370" y="763" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#19333E" text-anchor="start">unknown</text><rect x="60" y="840" width="210" height="32" rx="16" fill="#E8EFF5" stroke="none" stroke-width="2"/><text x="165.0" y="862" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#356989" text-anchor="middle">HUMAN PREFERENCE</text><text x="292" y="864" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">Solve the immediate need; fit existing facilities; avoid speculative expansion.</text><text x="60" y="910" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#95600B" text-anchor="start">?</text><text x="103" y="900" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">Still to settle: event order + duplicate transitions; obsolete timers after isolation or reopening;</text><text x="103" y="931" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#19333E" text-anchor="start">state restoration; timer lifetime + process liveness; compatibility; scenario reproduction.</text><text x="60" y="992" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#7047A3" text-anchor="start">Eligibility is not reserved permission or demonstrated health. No implementation or maintainer acceptance is claimed.</text></svg>