<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><title>The outside policy controls calls into the inside</title><desc>Wrapping retains the component instances and their separate states. Order changes where work can wait.</desc><defs><marker id="ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#19333E"/></marker><marker id="teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#007A78"/></marker><marker id="red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#B44635"/></marker><marker id="purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7047A3"/></marker><marker id="muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#526873"/></marker></defs><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FCFBF7" stroke="none" stroke-width="2"/><text x="60" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#007A78" text-anchor="start">COCKATIEL  /  A PICTORIAL WORKING ACCOUNT</text><text x="1540" y="48" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#526873" text-anchor="end">03 / 04</text><text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#19333E" text-anchor="start">The outside policy controls calls into the inside</text><text x="60" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526873" text-anchor="start">Wrapping retains the component instances and their separate states. Order changes where work can wait.</text><path d="M60,1026 L1540,1026" fill="none" stroke="#C9D4D5" stroke-width="1" stroke-linecap="round"/><text x="60" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526873" text-anchor="start">Source: 14 Oct 2026 working account, first extraction. Static inspection; no runtime verification.</text><text x="1540" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#526873" text-anchor="end">VIEW 3</text><rect x="60" y="195" width="228" height="32" rx="16" fill="#E6F3F0" stroke="none" stroke-width="2"/><text x="174.0" y="217" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#007A78" text-anchor="middle">ILLUSTRATIVE SITUATIONS</text><text x="318" y="217" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526873" text-anchor="start">Repeated tickets along arrows show successive positions of the same call.</text><text x="65" y="270" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#19333E" text-anchor="start">A</text><rect x="118" y="240" width="937" height="269" rx="18" fill="#E6F3F0" stroke="#007A78" stroke-width="3"/><text x="146" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#007A78" text-anchor="start">OUTER: BULKHEAD</text><path d="M157 320 V477 H1017 V320" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="458" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#007A78" text-anchor="start">An execution slot is occupied</text><g transform="translate(213 324) scale(0.9)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#95600B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#95600B" text-anchor="middle">op</text><path d="M16,60 L54,60" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round"/></g><path d="M298,360 L388,360" fill="none" stroke="#95600B" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)"/><text x="333" y="398" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#95600B" text-anchor="middle">waiting</text><rect x="410" y="301" width="582" height="112" rx="10" fill="#FCFBF7" stroke="#95600B" stroke-width="2"/><text x="433" y="333" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#95600B" text-anchor="start">INNER: BREAKER</text><g transform="translate(442 339) scale(0.6)"><path d="M0,55 L38,55" fill="none" stroke="#95600B" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#95600B" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="55" r="6" fill="#FCFBF7" stroke="#95600B" stroke-width="3"/><circle cx="112" cy="55" r="6" fill="#FCFBF7" stroke="#95600B" stroke-width="3"/><path d="M43,51 L96,12" fill="none" stroke="#95600B" stroke-width="5" stroke-linecap="round"/><path d="M52,65 L99,65" fill="none" stroke="#95600B" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)"/></g><circle cx="593" cy="370" r="25" fill="#FFF2D4" stroke="#95600B" stroke-width="2"/><text x="593" y="377" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#95600B" text-anchor="middle">busy</text><text x="667" y="363" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">Another recovery trial</text><text x="667" y="390" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">is already running</text><text x="1110" y="302" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#19333E" text-anchor="start">Capacity can be held</text><text x="1110" y="340" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#19333E" text-anchor="start">while waiting for</text><text x="1110" y="378" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#19333E" text-anchor="start">the breaker.</text><text x="1110" y="442" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526873" text-anchor="start">Occupied capacity need not mean</text><text x="1110" y="471" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526873" text-anchor="start">the supplied work has started.</text><text x="65" y="572" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#19333E" text-anchor="start">B</text><rect x="118" y="542" width="937" height="267" rx="18" fill="#FFF2D4" stroke="#95600B" stroke-width="3"/><text x="146" y="581" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#95600B" text-anchor="start">OUTER: BREAKER</text><g transform="translate(158 616) scale(0.8)"><path d="M0,55 L38,55" fill="none" stroke="#95600B" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#95600B" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="55" r="6" fill="#FCFBF7" stroke="#95600B" stroke-width="3"/><circle cx="112" cy="55" r="6" fill="#FCFBF7" stroke="#95600B" stroke-width="3"/><path d="M43,51 L96,12" fill="none" stroke="#95600B" stroke-width="5" stroke-linecap="round"/><path d="M52,65 L99,65" fill="none" stroke="#95600B" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)"/></g><path d="M288,660 L359,660" fill="none" stroke="#95600B" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)"/><g transform="translate(380 621) scale(0.85)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#95600B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#95600B" text-anchor="middle">trial</text><path d="M16,60 L54,60" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round"/></g><text x="410" y="741" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#95600B" text-anchor="middle">admitted</text><rect x="521" y="600" width="496" height="174" rx="10" fill="#FCFBF7" stroke="#007A78" stroke-width="2"/><text x="547" y="634" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#007A78" text-anchor="start">INNER: BULKHEAD</text><path d="M551 650 V746 H634 V650" fill="none" stroke="#007A78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(564.5 662) scale(0.8)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">run</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><path d="M685 650 V746 H768 V650" fill="none" stroke="#95600B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(698.5 662) scale(0.8)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#95600B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#95600B" text-anchor="middle">trial</text><path d="M16,60 L54,60" fill="none" stroke="#95600B" stroke-width="2" stroke-linecap="round"/></g><text x="803" y="681" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">Capacity full;</text><text x="803" y="708" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">trial waits</text><text x="803" y="735" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#19333E" text-anchor="start">in queue</text><path d="M445,660 L507,660" fill="none" stroke="#95600B" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)"/><text x="1110" y="603" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#19333E" text-anchor="start">A recovery attempt</text><text x="1110" y="641" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#19333E" text-anchor="start">can be admitted,</text><text x="1110" y="679" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#19333E" text-anchor="start">then wait for capacity.</text><text x="1110" y="742" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526873" text-anchor="start">Admission by one policy does not</text><text x="1110" y="771" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526873" text-anchor="start">settle the whole composition.</text><rect x="60" y="849" width="1480" height="150" rx="14" fill="#EEF1F3" stroke="none" stroke-width="2"/><text x="85" y="880" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#356989" text-anchor="start">RETRY OUTSIDE A BREAKER</text><g transform="translate(92 904) scale(0.58)"><path d="M0 0 H54 L70 16 V78 H0 Z" fill="#FCFBF7" stroke="#007A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 0 V16 H70" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007A78" text-anchor="middle">op</text><path d="M16,60 L54,60" fill="none" stroke="#007A78" stroke-width="2" stroke-linecap="round"/></g><path d="M141,928 L206,928" fill="none" stroke="#007A78" stroke-width="3" stroke-linecap="round" marker-end="url(#teal)"/><g transform="translate(226 885) scale(0.7)"><path d="M0,55 L38,55" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round"/><path d="M112,55 L150,55" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="55" r="6" fill="#FCFBF7" stroke="#007A78" stroke-width="3"/><circle cx="112" cy="55" r="6" fill="#FCFBF7" stroke="#007A78" stroke-width="3"/><path d="M44,55 L106,55" fill="none" stroke="#007A78" stroke-width="5" stroke-linecap="round"/></g><path d="M338,928 L407,928" fill="none" stroke="#007A78" stroke-width="3" stroke-linecap="round" marker-end="url(#teal)"/><circle cx="454" cy="928" r="29" fill="#FCFBF7" stroke="#007A78" stroke-width="2"/><text x="454" y="936" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#007A78" text-anchor="middle">work</text><path d="M454 960 V981 H185 V943" fill="none" stroke="#356989" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/><text x="560" y="890" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">Selected failure? Another attempt calls through the breaker again.</text><text x="560" y="925" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">Policy events describe local activity, not one whole-composition verdict.</text><text x="560" y="960" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#19333E" text-anchor="start">An outer retry or fallback can handle an inner failure before the caller sees it.</text></svg>